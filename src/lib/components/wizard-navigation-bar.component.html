<ul class="steps-indicator steps-{{numberOfWizardSteps}}">
  @for (step of wizardSteps; track step) {
<li [attr.id]="step.stepId" [class]="{
        'current': isCurrent(step),
        'editing': isEditing(step),
        'done': isDone(step),
        'optional': isOptional(step),
        'completed': isCompleted(step),
        'navigable': isNavigable(step)
  }">
      <a [awGoToStep]="step" [wizard]="wizard()">
        <div class="label">
          @if (step.stepTitleTemplate) {
            <ng-container [ngTemplateOutlet]="step.stepTitleTemplate.templateRef"
            [ngTemplateOutletContext]="{wizardStep: step}"></ng-container>
          }
          @if (!step.stepTitleTemplate) {
            {{step.stepTitle}}
          }
        </div>
        <div class="step-indicator"
          [ngStyle]="{ 'font-family': step.stepSymbolTemplate ? '' : step.navigationSymbol.fontFamily }">
          @if (step.stepSymbolTemplate) {
            <ng-container [ngTemplateOutlet]="step.stepSymbolTemplate.templateRef"
            [ngTemplateOutletContext]="{wizardStep: step}"></ng-container>
          }
          @if (!step.stepSymbolTemplate) {
            {{step.navigationSymbol.symbol}}
          }
        </div>
      </a>
    </li>
  }
</ul>
